[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniscidb"
version = "0.1.0"
description = "Cross-domain context and reasoning graph transfer for scientific QA synthesis"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.scripts]
omniscidb = "omniscidb.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["omniscidb*", "scripts", "prompts"]

[tool.setuptools.package-data]
prompts = ["*.md"]
